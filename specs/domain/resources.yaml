resources:
  users:
    endpoints:
      - method: POST
        path: /api/auth/login
      - method: POST
        path: /api/auth/logout
      - method: GET
        path: /api/auth/me
    fields:
      id: { type: integer, pk: true }
      email: { type: string, unique: true }
      name: { type: string }
      last_login: { type: timestamp }

  commission_calculations:
    endpoints:
      - method: POST
        path: /api/commissions
      - method: GET
        path: /api/commissions
      - method: GET
        path: /api/commissions/:id
    fields:
      id: { type: integer, pk: true }
      user_id: { type: integer, fk: users }
      calc_type: { type: string, enum: [dr_gm, securities] }
      source_file_path: { type: string }
      input_data: { type: jsonb }
      result_data: { type: jsonb }
      status: { type: string, enum: [pending, processing, completed, error] }
      created_at: { type: timestamp }

  commission_results:
    endpoints:
      - method: GET
        path: /api/commissions/:calc_id/results
      - method: GET
        path: /api/commissions/:calc_id/results/:id/download
    fields:
      id: { type: integer, pk: true }
      calculation_id: { type: integer, fk: commission_calculations }
      employee_name: { type: string }
      detail_data: { type: jsonb }
      report_file_path: { type: string }

  crawling_jobs:
    endpoints:
      - method: POST
        path: /api/crawling/start
      - method: GET
        path: /api/crawling/:id/status
    fields:
      id: { type: integer, pk: true }
      source_type: { type: string, enum: [securities_commission, irp_portfolio] }
      status: { type: string, enum: [pending, running, completed, failed] }
      result_data: { type: jsonb }
      error_message: { type: string }
      created_at: { type: timestamp }

  portfolio_analyses:
    endpoints:
      - method: POST
        path: /api/portfolios
      - method: GET
        path: /api/portfolios
      - method: GET
        path: /api/portfolios/:id
      - method: PUT
        path: /api/portfolios/:id
    fields:
      id: { type: integer, pk: true }
      user_id: { type: integer, fk: users }
      data_source: { type: string, enum: [crawling, excel] }
      raw_data: { type: jsonb }
      template_data: { type: jsonb }
      ai_analysis: { type: jsonb }
      rebalancing_suggestions: { type: jsonb }
      report_file_path: { type: string }
      status: { type: string }
      created_at: { type: timestamp }

  portfolio_items:
    endpoints:
      - method: GET
        path: /api/portfolios/:analysis_id/items
      - method: PUT
        path: /api/portfolios/:analysis_id/items/:id
    fields:
      id: { type: integer, pk: true }
      analysis_id: { type: integer, fk: portfolio_analyses }
      product_name: { type: string }
      product_type: { type: string, enum: [pension, irp] }
      current_value: { type: decimal }
      return_rate: { type: decimal }
      details: { type: jsonb }

  stock_themes:
    endpoints:
      - method: GET
        path: /api/stocks/themes
      - method: POST
        path: /api/stocks/themes/analyze
    fields:
      id: { type: integer, pk: true }
      theme_name: { type: string }
      ai_score: { type: decimal }
      news_summary: { type: text }
      stock_count: { type: integer }
      updated_at: { type: timestamp }

  stock_recommendations:
    endpoints:
      - method: POST
        path: /api/stocks/recommendations
      - method: GET
        path: /api/stocks/recommendations/:id
    fields:
      id: { type: integer, pk: true }
      user_id: { type: integer, fk: users }
      selected_themes: { type: jsonb }
      ai_scores: { type: jsonb }
      status: { type: string }
      created_at: { type: timestamp }

  recommended_stocks:
    endpoints:
      - method: GET
        path: /api/stocks/recommendations/:rec_id/stocks
      # 스크리닝: 지표 필터(예: PBR<1 & 정배열)로 종목 추림 (08-stock-etf-recommend M3)
      - method: GET
        path: /api/stocks/screening
    fields:
      id: { type: integer, pk: true }
      recommendation_id: { type: integer, fk: stock_recommendations }
      stock_code: { type: string }
      stock_name: { type: string }
      theme: { type: string }
      rank: { type: integer }
      return_1m: { type: decimal }
      return_3m: { type: decimal }
      return_6m: { type: decimal }
      institutional_buy: { type: bigint }
      foreign_buy: { type: bigint }
      is_top5: { type: boolean }
      analysis_report: { type: jsonb }
      # 스크리닝/근거 표시용 요약 지표 (상세는 stock_market_data 참조)
      pbr: { type: decimal }
      per: { type: decimal }
      composite_score: { type: decimal }      # 종합점수 (placeholder 로직, 사용자 자료 대기)
      signal_tags: { type: jsonb }            # ["golden_cross","ma_aligned"] 자동 해석 결과
      ma_alignment: { type: string, enum: [bullish, bearish, mixed] }  # 정배열/역배열
      allocation_pct: { type: decimal }       # Step3 비중 제안 (%)

  company_stock_pool:
    endpoints:
      - method: GET
        path: /api/stocks/pool
      - method: POST
        path: /api/stocks/pool
    fields:
      id: { type: integer, pk: true }
      pool_name: { type: string }
      stocks: { type: jsonb }
      created_at: { type: timestamp }

  content_projects:
    endpoints:
      - method: POST
        path: /api/content
      - method: GET
        path: /api/content
      - method: GET
        path: /api/content/:id
      - method: PUT
        path: /api/content/:id
    fields:
      id: { type: integer, pk: true }
      user_id: { type: integer, fk: users }
      content_type: { type: string, enum: [card_news, report, cover_promo] }
      title: { type: string }
      topic: { type: text }
      content_input: { type: text }
      brand_setting_id: { type: integer, fk: brand_settings }
      status: { type: string, enum: [draft, generating, completed] }
      created_at: { type: timestamp }

  content_versions:
    endpoints:
      - method: GET
        path: /api/content/:project_id/versions
      - method: POST
        path: /api/content/:project_id/versions
      - method: GET
        path: /api/content/:project_id/versions/:id/download
    fields:
      id: { type: integer, pk: true }
      project_id: { type: integer, fk: content_projects }
      version_number: { type: integer }
      ai_text_content: { type: text }
      generated_assets: { type: jsonb }
      file_path: { type: string }
      is_approved: { type: boolean }
      created_at: { type: timestamp }

  brand_settings:
    endpoints:
      - method: GET
        path: /api/brand
      - method: PUT
        path: /api/brand
    fields:
      id: { type: integer, pk: true }
      company_name: { type: string }
      primary_color: { type: string }
      secondary_color: { type: string }
      logo_path: { type: string }
      font_family: { type: string }
      style_config: { type: jsonb }

  ai_api_settings:
    endpoints:
      - method: GET
        path: /api/settings/ai
      - method: PUT
        path: /api/settings/ai
    fields:
      id: { type: integer, pk: true }
      provider: { type: string, enum: [claude, gemini] }
      api_key_encrypted: { type: text }
      is_active: { type: boolean }

  file_uploads:
    endpoints:
      - method: POST
        path: /api/upload/excel
    fields:
      id: { type: integer, pk: true }
      file_name: { type: string }
      file_path: { type: string }
      file_size: { type: integer }
      parsed_data: { type: jsonb }
      uploaded_at: { type: timestamp }

  # === 고객 포트폴리오 관리 (SCR-10, SCR-11) ===

  customers:
    endpoints:
      - method: GET
        path: /api/customers
      - method: GET
        path: /api/customers/:id
      - method: POST
        path: /api/customers
      - method: PUT
        path: /api/customers/:id
    fields:
      id: { type: integer, pk: true }
      name: { type: string }
      birth_date: { type: date }
      phone: { type: string }
      email: { type: string }
      occupation: { type: string }
      notes: { type: text }
      created_at: { type: timestamp }

  customer_portfolios:
    endpoints:
      - method: GET
        path: /api/customers/:customer_id/portfolios
      - method: POST
        path: /api/customers/:customer_id/portfolios
      - method: GET
        path: /api/customers/:customer_id/portfolios/:id
      - method: PUT
        path: /api/customers/:customer_id/portfolios/:id
      - method: DELETE
        path: /api/customers/:customer_id/portfolios/:id
    fields:
      id: { type: integer, pk: true }
      customer_id: { type: integer, fk: customers }
      name: { type: string }
      account_number: { type: string }
      account_type: { type: string }
      total_invested: { type: decimal }
      cash_balance: { type: decimal }
      created_at: { type: timestamp }

  portfolio_holdings:
    endpoints:
      - method: GET
        path: /api/portfolios/:portfolio_id/holdings
      - method: POST
        path: /api/portfolios/:portfolio_id/holdings
      - method: PUT
        path: /api/portfolios/:portfolio_id/holdings/:id
      - method: DELETE
        path: /api/portfolios/:portfolio_id/holdings/:id
    fields:
      id: { type: integer, pk: true }
      portfolio_id: { type: integer, fk: customer_portfolios }
      stock_code: { type: string }
      stock_name: { type: string }
      stock_type: { type: string, enum: [stock, etf] }
      holding_type: { type: string, enum: [dividend, growth] }
      quantity: { type: integer }
      avg_price: { type: decimal }
      purchase_date: { type: date }

  stock_market_data:
    endpoints:
      - method: GET
        path: /api/market/stocks/:code
      - method: GET
        path: /api/market/stocks/:code/chart
      - method: GET
        path: /api/market/stocks/:code/dividend
      - method: GET
        path: /api/market/stocks/:code/fundamentals
      - method: GET
        path: /api/market/stocks/:code/supply-demand
      # 시그널·종합점수 (이평선 시계열에서 코드 계산, 08 M3)
      - method: GET
        path: /api/market/stocks/:code/signals
    fields:
      code: { type: string, pk: true }
      name: { type: string }
      stock_type: { type: string, enum: [stock, etf] }
      current_price: { type: decimal }
      change_rate: { type: decimal }
      market_cap: { type: bigint }
      # 차트 데이터 (KIS API primary / 네이버 금융 fallback)
      price_history: { type: jsonb }
      ma5: { type: decimal }
      ma20: { type: decimal }
      ma60: { type: decimal }
      ma120: { type: decimal }
      volume_history: { type: jsonb }
      # 밸류에이션 (08 M2: PBR·PER·EPS·ROE·배당)
      per: { type: decimal }
      eps: { type: decimal }
      pbr: { type: decimal }
      roe: { type: decimal }
      # 시그널·종합점수 (08 M3 — 산정 로직은 사용자 제공 자료 분석 후 확정, 그 전까지 placeholder)
      signals: { type: jsonb }
      # signals 구조:
      #   golden_cross: bool   # 골든크로스 발생 (단기선이 장기선 상향 돌파)
      #   dead_cross: bool     # 데드크로스 발생
      #   ma_alignment: string # bullish(정배열) / bearish(역배열) / mixed
      #   disparity: {ma20, ma60}  # 이격도(%)
      composite_score: { type: decimal }   # 종합점수 (0~100, placeholder)
      score_breakdown: { type: jsonb }     # 점수 산정 근거 {valuation, momentum, supply, ...}
      # 배당 (주식/ETF 공통)
      dividend_yield: { type: decimal }
      dividend_cycle: { type: string }
      dividend_stability: { type: decimal }
      dividend_growth: { type: decimal }
      # 수급
      foreign_net_buy: { type: jsonb }
      institutional_net_buy: { type: jsonb }
      # 기업 정보 (주식 전용)
      sector: { type: string }
      business_summary: { type: text }
      revenue_trend: { type: jsonb }
      operating_profit_trend: { type: jsonb }
      themes: { type: jsonb }
      # themes 예시: ["AI", "로봇", "방산"] — AI 분석 또는 증권사 API 태그 기반
      supply_chain: { type: jsonb }
      # supply_chain 구조:
      #   customers: [{code, name, relation}]  # 납품처 (상위 기업)
      #   suppliers: [{code, name, relation}]  # 납품사 (하위 기업)
      #   partners:  [{code, name, relation}]  # 지분/파트너십 관계사
      # ETF 전용
      etf_holdings: { type: jsonb }
      etf_top10_ratio: { type: jsonb }
      data_source: { type: string, enum: [kis, naver] }
      updated_at: { type: timestamp }

  # === 주식·ETF 추천 고도화 (08-stock-etf-recommend) ===

  # 백테스트 — "1년 전 담았다면?" (추천 흐름 안, 근거 패널에서 호출, 08 M4)
  stock_backtests:
    endpoints:
      - method: GET
        path: /api/market/stocks/:code/backtest
    fields:
      id: { type: integer, pk: true }
      stock_code: { type: string }
      stock_name: { type: string }
      period: { type: string, enum: ["1m", "3m", "6m", "1y", "3y"] }
      entry_date: { type: date }
      entry_price: { type: decimal }
      current_price: { type: decimal }
      return_rate: { type: decimal }          # 해당 기간 수익률(%)
      benchmark_return: { type: decimal }      # 벤치마크(코스피 등) 동기간 수익률(%)
      max_drawdown: { type: decimal }          # 최대 낙폭(%)
      chart_data: { type: jsonb }              # 기간 수익률 추이 시계열
      data_source: { type: string, enum: [kis, naver] }

  # 추천 사후성과 추적 — 별도 탭 (08 M4)
  recommendation_performance:
    endpoints:
      - method: GET
        path: /api/stocks/performance
      - method: GET
        path: /api/stocks/performance/summary
    fields:
      id: { type: integer, pk: true }
      recommendation_id: { type: integer, fk: stock_recommendations }
      stock_code: { type: string }
      stock_name: { type: string }
      theme: { type: string }
      recommended_date: { type: date }
      recommended_price: { type: decimal }
      current_price: { type: decimal }
      return_since: { type: decimal }          # 추천 이후 수익률(%)
      benchmark_return: { type: decimal }       # 동기간 벤치마크 수익률(%)
      excess_return: { type: decimal }          # 초과수익(추천 - 벤치마크)
      holding_days: { type: integer }
      status: { type: string, enum: [hit, miss, holding] }  # 성공/실패/보유중
      composite_score_at_rec: { type: decimal } # 추천 시점 종합점수 (스코어 신뢰도 검증용)
      created_at: { type: timestamp }

  # === Wrap Retirement (랩 은퇴설계) ===

  customer_retirement_profiles:
    endpoints:
      - method: GET
        path: /api/v1/retirement/profiles
      - method: GET
        path: /api/v1/retirement/profiles/:customer_id
      - method: POST
        path: /api/v1/retirement/profiles
      - method: PUT
        path: /api/v1/retirement/profiles/:customer_id
    fields:
      id: { type: integer, pk: true }
      customer_id: { type: integer, fk: users, unique: true }
      target_retirement_fund: { type: bigint }
      desired_pension_amount: { type: bigint }
      age_at_design: { type: integer }
      current_age: { type: integer }
      desired_retirement_age: { type: integer }
      created_at: { type: timestamp }
      updated_at: { type: timestamp }

  desired_plans:
    endpoints:
      - method: GET
        path: /api/v1/retirement/desired-plans/:customer_id
      - method: PUT
        path: /api/v1/retirement/desired-plans/:customer_id
    fields:
      id: { type: integer, pk: true }
      profile_id: { type: integer, fk: customer_retirement_profiles }
      monthly_desired_amount: { type: bigint }
      retirement_period_years: { type: integer }
      target_total_fund: { type: bigint }
      required_lump_sum: { type: bigint }
      required_annual_savings: { type: bigint }
      calculation_params: { type: jsonb }
      created_at: { type: timestamp }
      updated_at: { type: timestamp }

  retirement_plans:
    endpoints:
      - method: GET
        path: /api/v1/retirement/plans/:customer_id
      - method: POST
        path: /api/v1/retirement/plans
      - method: PUT
        path: /api/v1/retirement/plans/:id
    fields:
      id: { type: integer, pk: true }
      profile_id: { type: integer, fk: customer_retirement_profiles }
      current_age: { type: integer }
      lump_sum_amount: { type: bigint }
      annual_savings: { type: bigint }
      saving_period_years: { type: integer }
      inflation_rate: { type: decimal }
      annual_return_rate: { type: decimal }
      target_retirement_fund: { type: bigint }
      target_pension_amount: { type: bigint }
      desired_retirement_age: { type: integer }
      possible_retirement_age: { type: integer }
      inheritance_consideration: { type: boolean }
      yearly_projections: { type: jsonb }
      created_at: { type: timestamp }
      updated_at: { type: timestamp }

  investment_records:
    endpoints:
      - method: GET
        path: /api/v1/retirement/investment-records
      - method: POST
        path: /api/v1/retirement/investment-records
      - method: PUT
        path: /api/v1/retirement/investment-records/:id
      - method: DELETE
        path: /api/v1/retirement/investment-records/:id
      - method: GET
        path: /api/v1/retirement/investment-records/annual-flow/:customer_id/:year
    fields:
      id: { type: integer, pk: true }
      profile_id: { type: integer, fk: customer_retirement_profiles }
      wrap_account_id: { type: integer, fk: wrap_accounts }
      record_type: { type: string, enum: [investment, additional_savings, withdrawal] }
      product_name: { type: string }
      investment_amount: { type: bigint }
      evaluation_amount: { type: bigint }
      return_rate: { type: decimal }
      status: { type: string, enum: [ing, exit, deposit] }
      start_date: { type: date }
      end_date: { type: date }
      predecessor_id: { type: integer, fk: investment_records }
      successor_id: { type: integer, fk: investment_records }
      memo: { type: text }
      created_at: { type: timestamp }
      updated_at: { type: timestamp }

  wrap_accounts:
    endpoints:
      - method: GET
        path: /api/v1/retirement/wrap-accounts
      - method: POST
        path: /api/v1/retirement/wrap-accounts
      - method: PUT
        path: /api/v1/retirement/wrap-accounts/:id
      - method: DELETE
        path: /api/v1/retirement/wrap-accounts/:id
    fields:
      id: { type: integer, pk: true }
      product_name: { type: string }
      securities_company: { type: string }
      investment_target: { type: string }
      target_return_rate: { type: decimal }
      description: { type: text }
      is_active: { type: boolean }
      created_at: { type: timestamp }
      updated_at: { type: timestamp }

  interactive_calculations:
    endpoints:
      - method: POST
        path: /api/v1/retirement/simulation/interactive
      - method: GET
        path: /api/v1/retirement/interactive/:customer_id
    fields:
      id: { type: integer, pk: true }
      profile_id: { type: integer, fk: customer_retirement_profiles }
      plan_year: { type: integer }
      actual_data: { type: jsonb }
      projected_data: { type: jsonb }
      deviation_rate: { type: decimal }
      ai_guide_result: { type: text }
      created_at: { type: timestamp }
      updated_at: { type: timestamp }

  pension_plans:
    endpoints:
      - method: POST
        path: /api/v1/retirement/pension/calculate
      - method: GET
        path: /api/v1/retirement/pension/:customer_id
      - method: PUT
        path: /api/v1/retirement/pension/:id
    fields:
      id: { type: integer, pk: true }
      profile_id: { type: integer, fk: customer_retirement_profiles }
      pension_type: { type: string, enum: [lifetime, fixed, inheritance] }
      accumulation_summary: { type: jsonb }
      distribution_plan: { type: jsonb }
      combined_graph_data: { type: jsonb }
      created_at: { type: timestamp }
      updated_at: { type: timestamp }

  retirement_ai_guide:
    endpoints:
      - method: POST
        path: /api/v1/retirement/ai-guide
    fields:
      profile_id: { type: integer, fk: customer_retirement_profiles }
      deviation_rate: { type: decimal }
      current_data: { type: jsonb }
      plan_data: { type: jsonb }
      guide_result: { type: text }
