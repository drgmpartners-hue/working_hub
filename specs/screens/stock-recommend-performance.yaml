version: "2.0"

screen:
  name: 추천 성과·검증 (사후성과)
  route: /investment/stock-recommend?tab=performance
  layout: full-width
  auth: true
  description: |
    주식/ETF 추천의 사후성과를 추적·검증하는 별도 탭 (08-stock-etf-recommend M4).
    과거 추천 종목이 추천 이후 어떤 성과를 냈는지, 벤치마크 대비 초과수익과
    추천 적중률(hit rate)을 추적해 추천 엔진/종합점수의 신뢰도를 검증한다.
    추천 화면(stock-recommend.yaml)의 [성과·검증] 탭으로 진입.

# 기존 구현 참고 — 신규 탭. 추천 화면의 탭 구조 안에서 동작
existing_implementation:
  host_page: frontend/src/app/(main)/investment/stock-recommend/page.tsx  # 탭 컨테이너에 추가
  api_prefix: /api/v1
  tab_pattern_ref: "앱 공통 탭 UI (Wrap 은퇴설계 page 탭 패턴 참고)"

data_requirements:
  - resource: recommendation_performance
    needs: [id, stock_code, stock_name, theme, recommended_date, recommended_price,
            current_price, return_since, benchmark_return, excess_return,
            holding_days, status, composite_score_at_rec]
    filters: { theme: "?theme", status: "?status", period: "?period" }

components:
  - id: main_tabs
    type: navigation
    position: main
    function: "탭 전환 — [추천] / [성과·검증] (현재 활성)"
    events:
      - on: click:tab_recommend
        do: /investment/stock-recommend 로 이동 (추천 탭)

  - id: performance_summary
    type: stats_card
    position: main
    function: |
      요약 카드: 전체 추천 적중률(%), 평균 초과수익(%), 추적 종목 수, 평균 보유일.
      성공/실패/보유중 분포.
    data_source:
      resource: recommendation_performance
      fields: [status, return_since, benchmark_return, excess_return]

  - id: performance_filter
    type: form
    position: main
    function: "필터 — 테마별 / 상태(성공·실패·보유중) / 기간"
    events:
      - on: change:filter
        do: 조건으로 recommendation_performance 재조회

  - id: performance_table
    type: table
    position: main
    function: |
      추천 사후성과 테이블.
      행 클릭 시 우측 근거 사이드패널(stock-detail.yaml)로 현재 종목 상태 확인.
    columns:
      - 종목명
      - 테마
      - 추천일
      - 추천가
      - 현재가
      - 추천이후 수익률
      - 벤치마크 대비(초과수익)
      - 보유일
      - 상태(성공/실패/보유중)
      - 추천시 종합점수
    data_source:
      resource: recommendation_performance
    events:
      - on: click:row
        do: 우측 근거 사이드패널 열기 (stock-detail.yaml)

  - id: score_reliability_chart
    type: chart
    position: main
    function: |
      종합점수 신뢰도 검증: 추천시 종합점수 구간별 평균 수익률 산점도/바 차트.
      (높은 점수 → 높은 수익률 상관관계 검증)
    data_source:
      resource: recommendation_performance
      fields: [composite_score_at_rec, return_since]

connections:
  navigations:
    - from: main_tabs
      to: /investment/stock-recommend
  embeds:
    - stock-detail (우측 근거 사이드패널 — 행 클릭)
  shared_components:
    - header_bar

tests:
  - name: 성과 요약 표시
    when: 성과·검증 탭 진입
    then:
      - 적중률·평균 초과수익·추적 종목 수 요약 카드 표시
      - 사후성과 테이블에 추천 종목별 수익률/벤치마크 대비 표시

  - name: 필터링
    when: 테마/상태 필터 적용
    then:
      - 조건을 만족하는 추천만 테이블·요약에 반영

  - name: 종합점수 신뢰도 검증
    when: 성과 데이터 로드 완료
    then:
      - 추천시 종합점수 구간별 평균 수익률 차트 표시

  - name: 종목 상태 드릴다운
    when: 테이블 행 클릭
    then:
      - 우측 근거 사이드패널에 현재 종목 차트·지표 표시
