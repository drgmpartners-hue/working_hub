# 기업 리포트 배치(Cron) 서비스 전용 설정.
# Railway 서비스 Settings > Config-as-code 경로에 /backend/railway.cron.toml 지정.
# 시작 명령과 Cron Schedule은 서비스별로 Railway 화면에서 입력한다.
#   briefing-build: python scripts/run_news_briefing.py daily-build   / 0 22 * * 0-4
#   briefing-send : python scripts/run_news_briefing.py send          / 30 23 * * 0-4   (월간도 함께 발송)
#   briefing-monthly: python scripts/run_news_briefing.py monthly     / 0 18 * * *      (매일 03:00 KST, 1일에만 실행)
#   report-half-year: python scripts/run_news_briefing.py half-year   / 0 17 30 1,7 *   (1/31·7/31 02:00 KST, 반기 보고서 예약)
#   report-doc-requests: python scripts/run_news_briefing.py doc-requests / 0 0 30 6,12 * (6/30·12/30 09:00 KST)
#   report-reminders: python scripts/run_news_briefing.py report-reminders / 0 0 * * 1   (매주 월 09:00 KST)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# 실패해도 자동 재실행하지 않는다(발송 중복 방지). 다음 예약 시각에 다시 돈다.
restartPolicyType = "NEVER"
