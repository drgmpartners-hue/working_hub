# 수정_tasks P1-5 — push·PR 마다 프론트 타입검사+빌드, 백엔드 테스트(실제 PostgreSQL 포함).
# 실패하면 배포를 막으려면(수동 설정 1회):
#   - Railway: 각 서비스 Settings > "Wait for CI" 켜기 (이 검사가 통과해야 배포)
#   - Vercel: GitHub 저장소 Settings > Branches > main 보호 규칙에서 이 검사(필수 상태 확인) 지정
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 프론트 (타입검사·빌드)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: 백엔드 (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: citest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/citest
      PERM_PG_URL: postgresql+asyncpg://postgres:ci@localhost:5432/citest
      SECRET_KEY: ci-secret-key-for-tests-only-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: 한글 글꼴(차트·PDF)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-nanum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: 마이그레이션(빈 DB 에서 처음부터)
        run: alembic upgrade head
      - run: python -m pytest -q
